<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Livraria — Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 420px; margin-top: 80px;">
  <div class="card">
    <h2 style="text-align:center; margin-bottom: 24px;">Livraria</h2>

    <div class="tabs">
      <button class="tab active" onclick="mostrarTab('login', this)">Entrar</button>
      <button class="tab" onclick="mostrarTab('registo', this)">Registar</button>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <!-- Formulario de login -->
    <div id="tab-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="o_teu@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••">
      </div>
      <button type="submit" onclick="fazerLogin()">Entrar</button>
    </div>

    <!-- Formulario de registo -->
    <div id="tab-registo" style="display:none">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="reg-nome" placeholder="O teu nome">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="o_teu@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••">
      </div>
      <button type="submit" onclick="fazerRegisto()">Criar conta</button>
    </div>
  </div>
</div>

<script>
  // Se ja tem token, vai direto para os livros
  if (localStorage.getItem('token')) {
    window.location.href = 'livros.html'
  }

  function mostrarTab(tab, btn) {
    document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none'
    document.getElementById('tab-registo').style.display = tab === 'registo' ? 'block' : 'none'
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    btn.classList.add('active')
    esconderMensagem()
  }

  function mostrarMensagem(texto, tipo) {
    const el = document.getElementById('mensagem')
    el.textContent = texto
    el.className = 'mensagem ' + tipo
  }

  function esconderMensagem() {
    const el = document.getElementById('mensagem')
    el.className = 'mensagem'
  }

  async function fazerLogin() {
    const email = document.getElementById('login-email').value
    const password = document.getElementById('login-password').value

    if (!email || !password) {
      return mostrarMensagem('Preenche todos os campos.', 'erro')
    }

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })

      const data = await res.json()

      if (!res.ok) {
        return mostrarMensagem(data.erro, 'erro')
      }

      localStorage.setItem('token', data.token)
      window.location.href = 'livros.html'
    } catch (err) {
      mostrarMensagem('Erro ao ligar ao servidor.', 'erro')
    }
  }

  async function fazerRegisto() {
    const nome = document.getElementById('reg-nome').value
    const email = document.getElementById('reg-email').value
    const password = document.getElementById('reg-password').value

    if (!nome || !email || !password) {
      return mostrarMensagem('Preenche todos os campos.', 'erro')
    }

    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, email, password })
      })

      const data = await res.json()

      if (!res.ok) {
        return mostrarMensagem(data.erro, 'erro')
      }

      mostrarMensagem('Conta criada! Podes fazer login agora.', 'sucesso')
      setTimeout(() => mostrarTab('login', document.querySelector('.tab')), 1500)
    } catch (err) {
      mostrarMensagem('Erro ao ligar ao servidor.', 'erro')
    }
  }
</script>

</body>
</html>
